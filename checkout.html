<!DOCTYPE HTML>

<html lang="en">
	<head>
		
		<meta charset="UTF-*">
		<meta name="author" content="thomas rotchford">
		<title>Cart Checkout Form Component</title>
		<link rel="stylesheet" href="main.css">


	</head>
	
	<body>
		<div id="side-menu">
			<nav>
				<a href="index.html">Home</a>
				<a href="checkout.html">Checkout Form</a>
			</nav>
		</div>
		<main>
			<header>
				<h1>Shopping Cart Checkout Component</h1>
			</header>
			<section>
				<form action="work in progress" method="post">

					<fieldset>
						<legend>Shipping Details</legend>
						<label for="name">Name:</label>
						<input type="text" id="name" name="name"> 

						<label for="addr1">Address 1:</label>
						<input type="text" id="addr1" name="addr1">
						<label for="addr2">Address 2:</label>
						<input type="text" id="addr2" name="addr2">
						<label for="city">City:</label>
						<input type="text" id="city" name="city">
						<label for="state">State:</label>
						<input type="text" id="state" name="state">
						<label for="zcode">Zip Code:</label>
						<input type="text" id="zcode" name="zcode">
						<label for="phone">Phone:</label>
						<input type="tel" id="phone" name="phone">
						<label for="email">Email:</label>
						<input type="text" id="email" name="email">
					</fieldset>

					<fieldset>
						<legend>Payment Details</legend>
						
						<label for="card name">Name On Card:</label>
						<input type="text" id="card name" name="card name">
									
						<label for="cardnum">Card Number:</label>
						<input type="text" id="cardnum" name="cardnum" inputmode="numeric">
						
						<label for="expiration">Exp Date:</label>
						<input type="month" id="expiration" name="expiration">
						

						<label for="ccv">CCV:</label>
						<input type="ccv" id="ccv" name="ccv" inputmode="numeric" maxlength="3">
						

					</fieldset>
			</section>
			<footer>
				<ul>
					
					<li><a href="work in progress">Under Construction 1</a></li>
					<li><a href="work in progress">Under Construction 2</a></li>
					<li><a href="work in progress">Under Construction 3</a></li>
					<li><a href="work in progress">Under Construction 4</a></li>
					<li><a href="work in progress">Under Construction 5</a></li>
					<li><a href="work in progress">Under Construction 6</a></li>

				</ul>
			</footer>
		</main>

	</body>
</html>
