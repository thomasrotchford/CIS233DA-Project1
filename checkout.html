<!DOCTYPE HTML>

<html lang="en">
	<head>
		
		<meta charset="UTF-*">
		<meta name="author" content="thomas rotchford">
		<title>Cart Checkout Form Component</title>
		<link rel="stylesheet" href="./css/main.css">


	</head>
	
	<body>
		<div id="side-menu">
			<nav>
				<a href="index.html">Home</a>
				<a href="checkout.html">Checkout Form</a>
			</nav>
		</div>
		<main>
			<header>
				<h1>Shopping Cart Checkout Component</h1>
			</header>
			<section>
				<form action="work in progress" method="post">

					<fieldset>
						<legend>Shipping Details</legend>
						<label for="name">Name:</label>
						<input type="text" id="name" name="name" required> 

						<label for="addr1">Address 1:</label>
						<input type="text" id="addr1" name="addr1" required>
						<label for="addr2">Address 2:</label>
						<input type="text" id="addr2" name="addr2">
						<label for="city">City:</label>
						<input type="text" id="city" name="city" required>
						<label for="state">State:</label>
						<input type="text" id="state" name="state" required>
						<label for="zcode">Zip Code:</label>
						<input type="text" id="zcode" name="zcode" pattern="^(?(^00000(|-0000))|(\d{5}(|-\d{4})))$" required>
						<label for="phone">Phone:</label>
						<input type="tel" id="phone" name="phone" required>
						<label for="email">Email:</label>
						<input type="text" id="email" name="email" required>
					</fieldset>

					<fieldset>
						<legend>Payment Details</legend>
						
						<label for="card name">Name On Card:</label>
						<input type="text" id="card name" name="card name" required>
									
						<label for="cardnum">Card Number:</label>
						<input type="text" id="cardnum" name="cardnum" pattern="^[0-9- ]{13,19}$" required>
						
						<label for="expiration">Exp Date:</label>
						<input type="month" id="expiration" name="expiration" required>
						

						<label for="ccv">CCV:</label>
						<input type="ccv" id="ccv" name="ccv" maxlength="3" required>
						

					</fieldset>
					<button type="submit">Purchase</button>
				</form>
			</section>
			<footer>
				<ul>
					
					<li><a href="work in progress">Under Construction 1</a></li>
					<li><a href="work in progress">Under Construction 2</a></li>
					<li><a href="work in progress">Under Construction 3</a></li>
					<li><a href="work in progress">Under Construction 4</a></li>
					<li><a href="work in progress">Under Construction 5</a></li>
					<li><a href="work in progress">Under Construction 6</a></li>

				</ul>
			</footer>
		</main>

	</body>
</html>
